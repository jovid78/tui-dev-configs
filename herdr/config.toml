onboarding = false

[ui]
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, dim = false, fg = "#FFFFFF" }],
  [{ token = "workspace", bold = true, fg = "#808080" }],
  [{ token = "tab", fg = "#4169E1" }, { token = "pane", fg = "#4169E1" }],
  ["state_text", { token = "agent", fg = "#FF2400" }],
]

[keys]
next_agent     = "prefix+a"          # a = agent
previous_agent = "prefix+shift+a"
next_workspace     = "prefix+ctrl+n"
previous_workspace = "prefix+ctrl+p"

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true, fg = "#FFFFFF" }],
  ["branch", "git_status"],
]

[theme.custom]
sidebar_bg    = "#101014"   # darker sidebar makes any highlight pop more
active_row_bg = "#2F5FB3"   # strong mid-blue
selection_bg  = "#6B4A00"   # amber, clearly a different color from the active row

[ui.toast]
delivery = "herdr"
