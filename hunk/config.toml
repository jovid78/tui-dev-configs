# Hunk config — https://hunk.dev/docs/configure/
theme = "bluloco-dark"
mode = "auto"            # split when wide, unified when narrow
line_numbers = true
tab_width = 4

# Bluloco Dark, matched to ~/.config/helix/themes/bluloco_dark.toml.
# Base is one-dark-pro (Bluloco is a One Dark derivative); we overlay its palette.
[themes.bluloco-dark]
base = "one-dark-pro"
label = "Bluloco Dark"
background = "#282c34"
panel = "#21242d"
panelAlt = "#2c313a"
border = "#3a3f4b"
accent = "#3691ff"
accentMuted = "#7a82da"
text = "#abb2bf"
muted = "#636d83"
lineNumberFg = "#636d83"
addedSignColor = "#3fc56b"
removedSignColor = "#ff6480"
fileNew = "#3fc56b"
fileDeleted = "#ff6480"
fileModified = "#f9c859"
fileRenamed = "#9f7efe"
fileUntracked = "#8bcdef"
noteBorder = "#9f7efe"

[themes.bluloco-dark.syntax_scopes]
"comment" = "#636d83"
"punctuation.definition.comment" = "#636d83"
"string" = "#f9c859"
"constant.character.escape" = "#ff936a"
"constant.numeric" = "#ff78f8"
"constant.language" = "#10b1fe"
"constant" = "#9f7efe"
"variable.other.constant" = "#9f7efe"
"keyword" = "#10b1fe"
"storage" = "#10b1fe"
"storage.type" = "#10b1fe"
"storage.modifier" = "#10b1fe"
"keyword.operator" = "#7a82da"
"punctuation" = "#7a82da"
"entity.name.function" = "#3fc56b"
"support.function" = "#3fc56b"
"meta.function-call" = "#3fc56b"
"entity.name.type" = "#ff6480"
"entity.name.class" = "#ff6480"
"support.type" = "#10b1fe"
"support.class" = "#ff6480"
"entity.name.namespace" = "#ff839b"
"entity.name.module" = "#ff839b"
"variable" = "#abb2bf"
"variable.parameter" = "#8bcdef"
"variable.language" = "#10b1fe"
"variable.other.property" = "#ce9887"
"variable.other.object.property" = "#ce9887"
"meta.object-literal.key" = "#ce9887"
"support.type.property-name" = "#ce9887"
"entity.name.tag" = "#3691ff"
"entity.other.attribute-name" = "#ff936a"
"entity.name.label" = "#50acae"
"meta.decorator" = "#50acae"
"markup.heading" = "#10b1fe"
"markup.inline.raw" = "#ce9887"
"markup.underline.link" = "#3691ff"
